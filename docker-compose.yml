services:
  cetworkovertime:
    image: pulongzhang/cetworkovertime:latest
    container_name: cetworkovertime
    ports:
      - "5000:5000"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./工作总结:/app/工作总结
      - ./output:/app/output
    env_file:
      - .env
    networks:
      - 1panel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  1panel-network:
    external: true
