services:
  cetworkovertime:
    build:
      context: .
    image: pulongzhang/cetworkovertime:3.0
    container_name: cetworkovertime
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./工作总结:/app/工作总结
      - ./output:/app/output
    env_file:
      - .env
    restart: unless-stopped
