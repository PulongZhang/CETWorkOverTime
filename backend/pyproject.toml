[project]
name = "cetworkovertime-backend"
version = "3.0.0"
description = "CETWorkOverTime FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "chardet>=5.0.0",
    "fastapi>=0.116.0",
    "itsdangerous>=2.2.0",
    "markdown>=3.5.0",
    "pydantic-settings>=2.10.0",
    "pymysql[rsa]>=1.1.0",
    "pyotp>=2.9.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/services/email_fetcher.py" = ["E501"]
"app/services/email_parser.py" = ["E501"]
"app/services/email_processor.py" = ["E501"]
"app/services/report_generator.py" = ["E501"]
