<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070b14" media="(prefers-color-scheme: dark)" />
    <title>CETWorkOverTime</title>
    <script>
      // 在应用挂载前先定好主题，避免深色模式下首屏闪白
      // 存储键与 @vueuse/core useDark 的默认值保持一致
      ;(function () {
        var saved = localStorage.getItem('vueuse-color-scheme') || 'auto'
        var dark =
          saved === 'dark' ||
          (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
